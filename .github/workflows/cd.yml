name: Procurement CD

on:
  workflow_run:
    workflows: ["Monorepo CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: procurement-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Ministry server
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, windows, x64, procurement-production]
    timeout-minutes: 60
    steps:
      - name: Verify server deployment files
        shell: powershell
        run: |
          $deploy = 'C:\apps\procurement-runtime\Deploy-Procurement.ps1'
          $helper = 'C:\apps\procurement-runtime\deployment-helper.cjs'
          if (-not (Test-Path -LiteralPath $deploy -PathType Leaf)) {
            throw "Deployment script missing: $deploy"
          }
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Deployment helper missing: $helper"
          }
          $deploySource = Get-Content -LiteralPath $deploy -Raw
          if ($deploySource -notmatch "prisma', 'migrate', 'deploy") {
            throw 'Install the prepared deployment script with automatic Prisma migrations before enabling this workflow.'
          }

      - name: Deploy CI-passed main commit
        shell: powershell
        env:
          CI_PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ($env:CI_PASSED_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'The successful CI run did not provide a valid commit SHA.'
          }
          Write-Host "Starting server deployment after CI passed for $env:CI_PASSED_SHA"
          & 'C:\apps\procurement-runtime\Deploy-Procurement.ps1' -Deploy
